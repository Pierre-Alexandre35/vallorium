        population_required: 20
        cost: { WOOD: 130, CLAY: 160, IRON: 90, CROP: 40 }
      - level: 2
        time: 65
        population_required: 40
        cost: { WOOD: 165, CLAY: 205, IRON: 120, CROP: 55 }

