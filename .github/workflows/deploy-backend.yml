
name: Deploy Backend to Cloud Run

on:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
      commit_sha:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  PROJECT_ID: vallorium-online-prod-01
  REGION: europe-west9
  REPOSITORY_ID: api
  IMAGE_NAME: backend
  BACKEND_DIR: vallorium/backend
  IAC_DIR: iac
  MIGRATION_JOB: vallorium-db-migrate
  SEED_JOB: vallorium-db-seed-reference

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BACKEND_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Check database jobs exist
        run: |
          for JOB in "${MIGRATION_JOB}" "${SEED_JOB}"; do
            if ! gcloud run jobs describe "${JOB}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --format='value(metadata.name)'; then
              echo "Cloud Run Job ${JOB} is missing or inaccessible. Provision it before releasing." >&2
              exit 1
            fi
          done

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" \
            --quiet

      - name: Build backend image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg APP_VERSION="${{ inputs.release_version }}" \
            --build-arg COMMIT_SHA="${{ inputs.commit_sha }}" \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY_ID}/${IMAGE_NAME}:${{ inputs.commit_sha }}" \
            "${BACKEND_DIR}"

      - name: Push backend image
        run: |
          docker push \
            "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY_ID}/${IMAGE_NAME}:${{ inputs.commit_sha }}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.IAC_DIR }}
        run: |
          terraform init \
            -input=false \
            -backend-config=envs/prod.backend.hcl

      - name: Terraform validate
        working-directory: ${{ env.IAC_DIR }}
        run: terraform validate -no-color

      - name: Terraform plan
        working-directory: ${{ env.IAC_DIR }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan \
            -var-file=envs/prod.tfvars \
            -var="image_tag=${{ inputs.commit_sha }}"

      - name: Block destructive Terraform changes
        working-directory: ${{ env.IAC_DIR }}
        run: |
          terraform show -json tfplan | jq -e '
            [.resource_changes[]?
             | select(.change.actions | index("delete"))]
            | length == 0
          '

      - name: Update migration job image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY_ID}/${IMAGE_NAME}:${{ inputs.commit_sha }}"

          gcloud run jobs update "${MIGRATION_JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}"

      - name: Run Alembic migrations
        run: |
          gcloud run jobs execute "${MIGRATION_JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --wait

      - name: Update reference seed job image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY_ID}/${IMAGE_NAME}:${{ inputs.commit_sha }}"

          gcloud run jobs update "${SEED_JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}"

      - name: Seed reference data
        run: |
          gcloud run jobs execute "${SEED_JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --wait

      - name: Terraform apply
        working-directory: ${{ env.IAC_DIR }}
        run: |
          terraform apply \
            -input=false \
            tfplan

      - name: Verify database-backed API endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --max-time 20 \
            "https://vallorium.online/api/v1/tribes" \
            | jq -e 'type == "array"' > /dev/null
