name: Deploy Frontend to Firebase Hosting

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: travian-prod-1234
  FRONTEND_DIR: vallorium/frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vallorium/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FRONTEND_SERVICE_ACCOUNT }}

      - name: Deploy frontend to Firebase Hosting
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npx --yes firebase-tools@15.28.1 deploy \
            --only hosting \
            --project "${PROJECT_ID}" \
            --non-interactive
